<style>

*{box-sizing:border-box}
body{margin:0;background:#080d1b;color:white;font-family:Arial,sans-serif;text-shadow:0 0 8px #00c9ed}

.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

button{padding:11px 15px;border:0;border-radius:8px;background:#00c9ed;color:#00121c;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.15)}
.search{flex:1;min-width:170px}
.menu-wrap{position:absolute;top:10px;left:10px;z-index:20;text-align:left}

.categories{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}

/* ===== New button design ===== */

/* ===== Dark mode: live animated background ===== */
body:not(.light){background:#04070f}
body:not(.light)::before{
  content:"";position:fixed;inset:-25%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(circle at 20% 30%,rgba(0,110,255,.30),transparent 38%),
    radial-gradient(circle at 80% 20%,rgba(130,60,255,.26),transparent 38%),
    radial-gradient(circle at 65% 80%,rgba(0,210,190,.18),transparent 38%),
    radial-gradient(circle at 10% 85%,rgba(255,60,140,.12),transparent 35%);
  animation:liveBg 16s ease-in-out infinite alternate;
}
body:not(.light)::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.7;
  background-image:
    radial-gradient(1.5px 1.5px at 20px 30px,#7fe9ff,transparent),
    radial-gradient(1.5px 1.5px at 90px 120px,#b79bff,transparent),
    radial-gradient(1px 1px at 160px 60px,#fff,transparent),
    radial-gradient(1.5px 1.5px at 230px 170px,#7fe9ff,transparent),
    radial-gradient(1px 1px at 60px 200px,#fff,transparent);
  background-size:260px 240px;
  animation:liveDots 28s linear infinite;
}
@keyframes liveBg{
  0%{transform:translate(0,0) scale(1) rotate(0)}
  50%{transform:translate(5%,-4%) scale(1.15) rotate(4deg)}
  100%{transform:translate(-5%,5%) scale(1.05) rotate(-4deg)}
}
@keyframes liveDots{from{background-position:0 0}to{background-position:-260px -240px}}
@media (prefers-reduced-motion:reduce){body:not(.light)::before,body:not(.light)::after{animation:none}}

<body>

<header>
  <div class="menu-wrap">
    <button onclick="toggleMenu(event)" aria-label="Menu">&#8942;</button>
    <div class="menu" id="menu">
      <button class="secondary" id="mOwnerLogin" onclick="closeMenu();openOwnerLogin()">Owner Login</button>
      <button class="danger" id="mOwnerLogout" style="display:none" onclick="closeMenu();ownerLogout()">Owner Logout</button>
      <button class="secondary" onclick="closeMenu();toggleTheme()">Dark / White</button>
    </div>
  </div>
  <div class="logo">7BLOCK</div>
</header>

<main id="app">
  <div class="top">
    <input class="search" id="search" placeholder="Search projects..." oninput="renderProjects()">
    <button id="newBtn" style="display:none" onclick="openNewProject()">+ New Project</button>
  </div>

  <section class="panel" id="uploadPanel">
    <h2 id="formTitle">Upload New Project</h2>
    <input id="pName" placeholder="Project title">
    <textarea id="pDescription" placeholder="Project description"></textarea>
    <input id="pLink" placeholder="Project link (optional)">
    <span class="field-label">Project image (optional)</span>
    <div class="thumb-box">
      <div class="thumb-prev" id="pPrev">No image</div>
      <label class="pick-btn">Choose image<input class="file-hidden" type="file" id="pImage" accept="image/*" onchange="pickImage(this)"></label>
      <button type="button" class="secondary" onclick="clearImage()">Remove</button>
    </div>
    <select id="pPrivacy">
      <option value="Public">Public</option>
      <option value="Private">Private (only me)</option>
    </select>
    <button onclick="saveProject()" id="saveButton">Upload</button>
    <button class="secondary" onclick="closeUpload()">Cancel</button>
    <button class="danger" id="delBtn" style="display:none" onclick="deleteFromEdit()">Delete project</button>
  </section>

  <section id="projects"></section>

</main>

<aside id="cDrawer">
  <div class="cd-head"><b id="cdTitle"></b><button class="secondary" onclick="closeDrawer()" aria-label="Close">&#10005;</button></div>
  <div class="clist" id="cdList"></div>
  <input id="cdName" placeholder="Your name">
  <textarea id="cdText" rows="3" placeholder="Write a comment..."></textarea>
  <button onclick="sendComment()">Send comment</button>
</aside>

<div class="modal" id="ownerModal">
  <div class="modal-card">
    <h2 id="ownerTitle">Owner Login</h2>
    <p class="pubnote">Enter your owner code</p>
    <div class="pw">
      <input id="ownerPw" type="password" maxlength="20" autocomplete="off">
      <button type="button" class="eye" onclick="togglePw('ownerPw',this)">👁</button>
    </div>
    <div class="err" id="ownerErr"></div>
    <div class="row">
      <button onclick="ownerSubmit()">Continue</button>
      <button class="secondary" onclick="closeOwnerLogin()">Cancel</button>
    </div>
  </div>
</div>

<div class="modal" id="contactModal">
  <div class="modal-card">
    <h2>Contact / Feedback</h2>
    <label>Name</label>
    <input id="cName" placeholder="Your name">
    <label>Gmail</label>
    <input id="cEmail" type="email" placeholder="yourname@gmail.com">
    <label>Message</label>
    <textarea id="cMessage" rows="5" placeholder="Write your message..."></textarea>
    <input type="checkbox" id="cBot" style="display:none" tabindex="-1" autocomplete="off">
    <div id="cMsg"></div>
    <div class="row">
      <button id="cSend" onclick="sendContact()">Send</button>
      <button class="secondary" onclick="closeContact()">Cancel</button>
    </div>
  </div>
</div>

<div class="modal" id="deleteModal">
  <div class="modal-card">
    <h2>Delete project?</h2>
    <p>Delete <b id="delName"></b>? This cannot be undone.</p>
    <div class="row">
      <button class="danger" onclick="confirmDelete()">Delete</button>
      <button class="secondary" onclick="cancelDelete()">Cancel</button>
    </div>
  </div>
</div>


<script>
/* ===== Games shown to EVERY visitor. Owner pastes "publish data" here. ===== */
const PUBLISHED_GAMES=[{"id":1762560000000,"name":"Thimdal","description":"","link":"","privacy":"Public","likes":0,"dislikes":0}];

const WEB3FORMS_KEY="c078f96e-1a61-40a7-9c58-49d7dd8c74ad";

let isOwner=sessionStorage.getItem("7block_owner")==="1";
let myGames=JSON.parse(localStorage.getItem("7block_projects")||"[]");   // owner's local drafts
let reactions=JSON.parse(localStorage.getItem("7block_reactions")||"{}"); // per-device likes/comments
let editingId=null,commandProjectId=null,deleteId=null;

function allGames(){
  const pub=PUBLISHED_GAMES.filter(p=>!myGames.some(m=>m.id===p.id));
  return isOwner?[...myGames,...pub]:PUBLISHED_GAMES.filter(p=>p.privacy!=="Private");
}
function saveData(){localStorage.setItem("7block_projects",JSON.stringify(myGames))}
function saveReactions(){localStorage.setItem("7block_reactions",JSON.stringify(reactions))}
function R(id){return reactions[id]=reactions[id]||{vote:0,comments:[]}}

/* ---------- Owner login (password hash stored on owner's device) ---------- */
const OWNER_HASHES=["496172b42fe0a9e9d0a742ea5e0bcdd944f7c5aa92dcdedd83e2e41afcab8129","f2014794079"];
async function sha(t){
  try{
    const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("7block|"+t));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }catch(e){
    let h=5381;for(const c of "7block|"+t)h=((h<<5)+h+c.charCodeAt(0))>>>0;return "f"+h;
  }
}
function ownerErr(t){const e=document.getElementById("ownerErr");e.textContent=t;e.style.display=t?"block":"none"}
function openOwnerLogin(){
  
  document.getElementById("ownerPw").value="";ownerErr("");
  document.getElementById("ownerModal").style.display="block";
}
function closeOwnerLogin(){document.getElementById("ownerModal").style.display="none"}
async function ownerSubmit(){
  const code=document.getElementById("ownerPw").value.trim().toUpperCase();
  if(!OWNER_HASHES.includes(await sha(code))){ownerErr("Wrong owner code");return}
  sessionStorage.setItem("7block_owner","1");isOwner=true;
  closeOwnerLogin();applyOwnerUI();renderProjects();
}
function ownerLogout(){
  sessionStorage.removeItem("7block_owner");isOwner=false;
  
  closeUpload();applyOwnerUI();renderProjects();
}
function applyOwnerUI(){
  document.getElementById("newBtn").style.display=isOwner?"":"none";
  document.getElementById("mOwnerLogin").style.display=isOwner?"none":"";
  document.getElementById("mOwnerLogout").style.display=isOwner?"":"none";
}
function togglePw(id,btn){
  const i=document.getElementById(id),show=i.type==="password";
  i.type=show?"text":"password";btn.textContent=show?"🙈":"👁";
}
async function exportPublish(){
  const data=JSON.stringify(allGames().filter(p=>p.privacy!=="Private").map(({votes,...g})=>g));
  const text="const PUBLISHED_GAMES="+data+";";
  try{await navigator.clipboard.writeText(text);alert("Publish data copied. Replace the PUBLISHED_GAMES line in your HTML file with it.")}
  catch(e){prompt("Copy this and replace the PUBLISHED_GAMES line:",text)}
}

/* ---------- Contact ---------- */
function cMsg(t,type){const m=document.getElementById("cMsg");m.textContent=t;m.className=t?type:""}
function openContact(){
  
  ["cName","cEmail","cMessage"].forEach(i=>document.getElementById(i).value="");
  cMsg("");document.getElementById("cSend").disabled=false;
  document.getElementById("contactModal").style.display="block";
}
function closeContact(){document.getElementById("contactModal").style.display="none"}
async function sendContact(){
  const name=document.getElementById("cName").value.trim();
  const email=document.getElementById("cEmail").value.trim();
  const message=document.getElementById("cMessage").value.trim();
  if(!name||!email||!message){cMsg("Fill name, Gmail and message","err");return}
  const btn=document.getElementById("cSend");btn.disabled=true;cMsg("Sending...","ok");
  try{
    const r=await fetch("https://api.web3forms.com/submit",{
      method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
      body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:"7BLOCK SHARE HUB - New message",from_name:"7BLOCK SHARE HUB",name,email,message,botcheck:document.getElementById("cBot").checked})
    });
    const d=await r.json();
    if(d.success){cMsg("Message sent ✔","ok");document.getElementById("cMessage").value=""}
    else cMsg(d.message||"Could not send. Try again.","err");
  }catch(e){cMsg("Network error. Check internet and try again.","err")}
  btn.disabled=false;
}

/* ---------- Image + type helpers ---------- */
let pImgData="";
function setPrev(){
  const el=document.getElementById("pPrev");
  if(pImgData){el.style.backgroundImage='url("'+pImgData+'")';el.textContent=""}
  else{el.style.backgroundImage="";el.textContent="No image"}
}
function pickImage(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,640/Math.max(im.width,im.height));
      const c=document.createElement("canvas");
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      pImgData=c.toDataURL("image/jpeg",0.8);setPrev();
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(f);inp.value="";
}
function clearImage(){pImgData="";setPrev()}

/* ---------- Upload / edit / delete (owner only) ---------- */
function openNewProject(){
  if(!isOwner)return;
  editingId=null;
  document.getElementById("formTitle").textContent="Upload New Project";
  document.getElementById("saveButton").textContent="Upload";
  ["pName","pDescription","pLink"].forEach(i=>document.getElementById(i).value="");
  document.getElementById("pPrivacy").value="Public";
  pImgData="";setPrev();
  document.getElementById("delBtn").style.display="none";
  const panel=document.getElementById("uploadPanel");
  panel.style.display="block";
  setTimeout(()=>{panel.scrollIntoView({behavior:"smooth",block:"start"});document.getElementById("pName").focus({preventScroll:true})},100);
}
function closeUpload(){document.getElementById("uploadPanel").style.display="none";document.getElementById("delBtn").style.display="none";editingId=null}
function deleteFromEdit(){if(editingId!==null)deleteProject(editingId)}
function saveProject(){
  if(!isOwner){alert("Only the owner can upload");return}
  const name=document.getElementById("pName").value.trim();
  const description=document.getElementById("pDescription").value.trim();
  const link=document.getElementById("pLink").value.trim();
  if(!name){alert("Enter project title");return}
  const backup=JSON.stringify(myGames),wasEditing=editingId!==null;
  const data={name,description,link,privacy:document.getElementById("pPrivacy").value,image:pImgData};
  if(wasEditing){
    let p=myGames.find(x=>x.id===editingId);
    if(p)Object.assign(p,data);
    else myGames.unshift({id:editingId,...data}); // editing a published game: keep a local copy
  }else myGames.unshift({id:Date.now(),...data});
  try{saveData()}catch(e){myGames=JSON.parse(backup);alert("Storage is full. ");return}
  closeUpload();renderProjects();
  alert(wasEditing?"Project updated!":"Project uploaded!");
}
function editProject(id){
  if(!isOwner)return;
  const p=allGames().find(x=>x.id===id);if(!p)return;
  editingId=id;
  document.getElementById("formTitle").textContent="Edit Project";
  document.getElementById("saveButton").textContent="Save Changes";
  document.getElementById("pName").value=p.name;
  document.getElementById("pDescription").value=p.description||"";
  document.getElementById("pLink").value=p.link||"";
  document.getElementById("pPrivacy").value=p.privacy||"Public";
  pImgData=p.image||"";setPrev();
  document.getElementById("delBtn").style.display="";
  const panel=document.getElementById("uploadPanel");
  panel.style.display="block";
  setTimeout(()=>{panel.scrollIntoView({behavior:"smooth",block:"start"});document.getElementById("pName").focus({preventScroll:true})},100);
}
function deleteProject(id){
  if(!isOwner)return;
  const p=allGames().find(x=>x.id===id);if(!p)return;
  deleteId=id;document.getElementById("delName").textContent=p.name;
  document.getElementById("deleteModal").style.display="block";
}
function cancelDelete(){deleteId=null;document.getElementById("deleteModal").style.display="none"}
function confirmDelete(){
  const id=deleteId;cancelDelete();if(id===null||!isOwner)return;
  myGames=myGames.filter(x=>x.id!==id);
  const i=PUBLISHED_GAMES.findIndex(x=>x.id===id);
  if(i>-1)PUBLISHED_GAMES.splice(i,1); // hidden for this session; remove from file to delete for everyone
  if(openId===id)closeDrawer();
  if(editingId===id)closeUpload();
  saveData();renderProjects();
}

/* ---------- Render ---------- */
function renderProjects(){
  const box=document.getElementById("projects");box.innerHTML="";
  const search=document.getElementById("search").value.toLowerCase();
  const list=allGames().filter(p=>(p.name.toLowerCase().includes(search)||(p.description||"").toLowerCase().includes(search)));
  if(!list.length){box.innerHTML='<div id="empty">No projects yet.</div>';return}
  list.forEach(p=>{
    const r=R(p.id),mine=r.vote;
    const likes=(p.likes||0)+(mine===1?1:0),dislikes=(p.dislikes||0)+(mine===-1?1:0);
    const card=document.createElement("div");card.className="project";
    card.innerHTML=`
      <h3></h3><small></small><p></p>
      <div class="actions">
        <button class="${mine===1?'voted':'secondary'}" onclick="vote(${p.id},1)">👍 ${likes}</button>
        <button class="${mine===-1?'voted-down':'secondary'}" onclick="vote(${p.id},-1)">👎 ${dislikes}</button>
        <button class="secondary" onclick="toggleComments(${p.id})">Comments (${r.comments.length})</button>
        <button class="secondary share-btn" title="Share" aria-label="Share" onclick="shareProject(${p.id})">🔗</button>
        ${isOwner?`<button class="secondary" onclick="editProject(${p.id})">Edit</button>`:""}
      </div>`;
    const h=card.querySelector("h3");h.textContent=p.name;
    if(p.link){h.classList.add("title-link");h.title="Open";h.onclick=()=>openProject(p.id)}
    card.querySelector("small").textContent=(p.privacy||"Public");
    if(p.image){const im=document.createElement("img");im.className="card-thumb";im.src=p.image;im.alt=p.name;card.prepend(im)}
    card.querySelector("p").textContent=p.description||"";
    card.id="p"+p.id;
    box.appendChild(card);
  });
}
function vote(id,v){const r=R(id);r.vote=r.vote===v?0:v;saveReactions();renderProjects()}
function openProject(id){
  const p=allGames().find(x=>x.id===id);if(!p||!p.link)return;
  let url=p.link.trim();if(!/^https?:\/\//i.test(url))url="https://"+url;
  window.open(url,"_blank","noopener");
}

/* ---------- Comments (right-side box) ---------- */
let openId=null;
function toggleComments(id){
  openId=id;renderDrawer();
  document.getElementById("cDrawer").classList.add("open");
}
function closeDrawer(){openId=null;document.getElementById("cDrawer").classList.remove("open")}
function renderDrawer(){
  if(openId===null)return;
  const p=allGames().find(x=>x.id===openId);if(!p){closeDrawer();return}
  document.getElementById("cdTitle").textContent=p.name;
  const list=document.getElementById("cdList");list.innerHTML="";
  const c=R(p.id).comments;
  if(!c.length){const e=document.createElement("p");e.textContent="No comments yet.";list.appendChild(e)}
  c.forEach(x=>{const d=document.createElement("p");const b=document.createElement("b");b.textContent=x.user+": ";d.append(b,document.createTextNode(x.text));list.appendChild(d)});
  list.scrollTop=list.scrollHeight;
  const nm=document.getElementById("cdName");
  if(!nm.value)nm.value=localStorage.getItem("7block_cname")||"";
}
function sendComment(){
  if(openId===null)return;
  const nm=document.getElementById("cdName"),tx=document.getElementById("cdText");
  const text=tx.value.trim();if(!text)return;
  R(openId).comments.push({user:nm.value.trim()||"Guest",text});
  localStorage.setItem("7block_cname",nm.value.trim());
  tx.value="";saveReactions();renderDrawer();renderProjects();
}

/* ---------- Share ---------- */
async function shareProject(id){
  const p=allGames().find(x=>x.id===id);if(!p)return;
  const url=location.href.split("#")[0]+"#p"+id;
  try{if(navigator.share){await navigator.share({title:p.name,text:p.name+" - 7BLOCK",url});return}}
  catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(url);alert("Link copied!")}
  catch(e){prompt("Copy this link:",url)}
}

/* ---------- Misc ---------- */
function toggleMenu(e){e.stopPropagation();const m=document.getElementById("menu");m.style.display=m.style.display==="block"?"none":"block"}
function closeMenu(){document.getElementById("menu").style.display="none"}
document.addEventListener("click",e=>{if(!e.target.closest(".menu-wrap"))closeMenu()});
function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("7block_theme",document.body.classList.contains("light")?"light":"dark");
}
if(localStorage.getItem("7block_theme")==="light")document.body.classList.add("light");
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.getElementById("ownerModal").style.display==="block")ownerSubmit()});
applyOwnerUI();renderProjects();
if(location.hash.startsWith("#p")){const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
</script>
